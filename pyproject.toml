[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertforge"
version = "0.0.1"
description = "ExpertForge — reproducible language-model research and engineering project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "ExpertForge contributors" }]
keywords = ["llm", "moe", "training", "research"]
# Runtime infrastructure required by every resolved run: Pydantic for frozen
# typed records, PyYAML for restricted configuration authoring, and NumPy for
# the explicit process-global and owned-generator RNG contract (Issue #8).
dependencies = [
    "numpy>=2,<3",
    "pydantic>=2.13,<3",
    "pyyaml>=6.0.3,<7",
]

# Heavy D0 implementation surfaces remain opt-in so Milestone 0 users and the
# base package import do not acquire data/model framework dependencies.
[project.optional-dependencies]
d0-data = [
    "pyarrow>=25,<26",
]
d0-model = [
    "torch>=2.4,<3",
]

[project.scripts]
# Configuration resolver CLI (Issue #5).
expertforge-config = "expertforge.config.cli:main"

[project.urls]
Repository = "https://github.com/ElephantRock/ExpertForge"

# Tell hatchling where the import package lives (src/ layout).
[tool.hatch.build.targets.wheel]
packages = ["src/expertforge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Dependency groups (managed by uv; recorded in uv.lock)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    # Type stubs for PyYAML (the runtime dep ships without stubs). Required so
    # `mypy --strict` can type the restricted YAML loader (Issue #5 §2).
    "types-pyyaml>=6.0",
]

# Pin the uv executable used locally and by setup-uv so CI does not silently
# change toolchain behavior when a new uv release is published.
[tool.uv]
required-version = "0.11.16"

# ---------------------------------------------------------------------------
# Ruff: formatter + linter + import organizer (single style engine)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["doctrine", "reports", "experiments"]

[tool.ruff.lint]
# Start with a conservative, broadly-accepted rule set.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["expertforge", "scripts"]

[tool.ruff.format]
# Defaults are the canonical style; no overrides.

# ---------------------------------------------------------------------------
# mypy: static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
packages = ["src.expertforge"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true
# Pydantic mypy plugin: lets mypy represent frozen models and extra="forbid"
# semantics during static analysis (Issue #5 decision §2).
plugins = ["pydantic.mypy"]

# Pydantic plugin settings: treat dataclasses/models as written.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src", "."]
markers = [
    "integration: portable cross-component or subprocess/filesystem integration tests",
    "smoke: end-to-end training or recovery smoke tests (Issue #14 owns the final gate)",
    "accelerator: optional tests requiring accelerator hardware or its runtime",
]
