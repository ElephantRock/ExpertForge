name: Experiment
description: Run a controlled experiment. Must state hypothesis, control, fixed constraints, and the decision the result will inform.
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        Experiments must record configuration, manifest, and lightweight evidence
        in GitHub. Large artifacts (datasets, checkpoints, traces) may live
        outside GitHub but require provenance (doctrine §14).
  - type: dropdown
    id: environment
    attributes:
      label: Execution environment
      options:
        - web-assistant
        - local-assistant
        - human
        - joint
    validations:
      required: true
  - type: dropdown
    id: maturity_stage
    attributes:
      label: Maturity stage
      description: Top-level platform capability/integration stage this experiment targets (model-lineage.md §2).
      options:
        - Milestone 0 (experimental substrate)
        - D0 (minimal dense baseline)
        - D1 (optimized dense baseline)
        - D2 (efficient dense variants)
        - M0 (minimal MoE)
        - M1 (balanced-routing MoE)
        - M2 (instrumented MoE)
        - M3 (locality-trained MoE)
        - M4 (structured-expert MoE)
        - M5 (native ExpertOS-aware MoE)
        - none/not-applicable
    validations:
      required: true
  - type: dropdown
    id: research_family
    attributes:
      label: Research family
      description: Orthogonal research family isolating one architectural mechanism (model-lineage.md §3). Use none/not-applicable for substrate/systems work outside a mechanism family.
      options:
        - F0 (exact-attention dense baseline)
        - F1 (additive linear-attention memory)
        - F2 (delta-rule memory)
        - F3 (gated recurrent memory)
        - F4 (fine-grained/KDA-style recurrent memory)
        - F5 (hybrid sequence memory)
        - F6 (depth-selective residual memory / AttnRes)
        - F7 (conventional sparse MoE)
        - F8 (latent and structured experts)
        - F9 (deployment-aware expert routing)
        - F10 (integrated memory-system interactions)
        - none/not-applicable
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: The claim this experiment will test.
    validations:
      required: true
  - type: textarea
    id: control
    attributes:
      label: Control
      description: The baseline or comparison condition.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Fixed constraints
      description: Model version, schema version, hardware, quantization, seeds, and any held fixed.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision this informs
      description: Which architectural, schema, or baseline decision will the result inform?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What evidence must be produced and recorded for this experiment to close?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Current status
