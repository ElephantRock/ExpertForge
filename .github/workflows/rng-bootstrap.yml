name: RNG Bootstrap

on:
  push:
    branches:
      - local/8-seed-rng

permissions:
  contents: write

concurrency:
  group: rng-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: local/8-seed-rng
          persist-credentials: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python
        run: uv python install 3.11

      - name: Generate locked environment
        run: |
          uv lock
          uv sync --locked

      - name: Apply deterministic formatting fixes
        run: |
          uv run --locked ruff format .
          uv run --locked ruff check --fix-only .

      - name: Commit generated lock and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rng-bootstrap.yml
          git add -A
          git commit -m "chore(rng): lock dependencies and format implementation"
          git push origin HEAD:local/8-seed-rng
