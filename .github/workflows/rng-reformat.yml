name: RNG Reformat

on:
  push:
    branches:
      - local/8-seed-rng

permissions:
  contents: write

concurrency:
  group: rng-reformat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: local/8-seed-rng
          persist-credentials: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Format, lint-fix imports, and remove workflow
        run: |
          uv run --locked ruff format src/expertforge/rng tests/test_rng_*.py
          uv run --locked ruff check --fix-only src/expertforge/rng tests/test_rng_*.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rng-reformat.yml
          git add src/expertforge/rng tests/test_rng_*.py
          git commit -m "style(rng): format atomic protocol revision"
          git push origin HEAD:local/8-seed-rng
