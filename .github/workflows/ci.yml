name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality and fast tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --locked --extra d0-data --extra d0-model

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run mypy
        run: uv run --locked mypy src tests

      - name: Validate D0 ratification bundle
        run: uv run --locked python -m scripts.validate_d0_ratification > /dev/null

      - name: Run fast CPU suite
        run: uv run --locked pytest -m "not integration and not smoke and not accelerator"

      - name: Check package import
        run: uv run --locked python -c "import expertforge"

      - name: Check configuration CLI fixture
        run: uv run --locked expertforge-config configs/smoke.yaml > /dev/null

      - name: Check lockfile
        run: uv lock --check

      - name: Validate repository policy
        run: uv run --locked python scripts/validate_repository.py all

  integration:
    name: CPU integration tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run portable CPU integration suite
        run: uv run --locked pytest -m "integration and not smoke and not accelerator"

  smoke:
    name: Milestone 0 smoke gate
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run locked smoke tier
        run: uv run --locked pytest -m "smoke and not accelerator"

      - name: Run the one-command smoke gate
        run: |
          uv run --locked python -m expertforge.smoke.run \
            --artifact-root runs/m0-smoke-ci \
            --config configs/m0-smoke-gate.yaml \
            --repo .
