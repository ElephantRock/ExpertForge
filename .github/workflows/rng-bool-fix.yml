name: RNG Bool Fix

on:
  push:
    branches:
      - local/8-seed-rng

permissions:
  contents: write

concurrency:
  group: rng-bool-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: local/8-seed-rng
          persist-credentials: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Add strict binary-flag validators and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/expertforge/rng/state.py')
          text = path.read_text()
          text = text.replace(
              '    cached_gaussian: float\n\n    @model_validator(mode="after")\n',
              '    cached_gaussian: float\n\n'
              '    @field_validator("has_gauss", mode="before")\n'
              '    @classmethod\n'
              '    def _reject_boolean_flag(cls, value: object) -> object:\n'
              '        if isinstance(value, bool):\n'
              '            raise ValueError("has_gauss must be the integer 0 or 1, not a boolean")\n'
              '        return value\n\n'
              '    @model_validator(mode="after")\n',
          )
          text = text.replace(
              '    uinteger: int = Field(ge=0, le=2**32 - 1)\n\n    @model_validator(mode="after")\n',
              '    uinteger: int = Field(ge=0, le=2**32 - 1)\n\n'
              '    @field_validator("has_uint32", mode="before")\n'
              '    @classmethod\n'
              '    def _reject_boolean_flag(cls, value: object) -> object:\n'
              '        if isinstance(value, bool):\n'
              '            raise ValueError("has_uint32 must be the integer 0 or 1, not a boolean")\n'
              '        return value\n\n'
              '    @model_validator(mode="after")\n',
          )
          path.write_text(text)

          path = Path('tests/test_rng_state.py')
          text = path.read_text().replace(
              '        (("numpy_generator", "has_uint32"), False),\n',
              '        (("numpy_generator", "has_uint32"), False),\n'
              '        (("numpy_legacy", "has_gauss"), True),\n',
          )
          path.write_text(text)
          PY
          uv run --locked ruff format src/expertforge/rng/state.py tests/test_rng_state.py
          uv run --locked ruff check --fix-only src/expertforge/rng/state.py tests/test_rng_state.py

      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rng-bool-fix.yml
          git add src/expertforge/rng/state.py tests/test_rng_state.py
          git commit -m "fix(rng): reject boolean NumPy state flags"
          git push origin HEAD:local/8-seed-rng
