name: Run pass 7 checkpoint fixes

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: local/11-checkpoint-system
          fetch-depth: 0
      - name: Check guarded trigger
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -Fq '[apply-pass7-fixes]'; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        if: steps.guard.outputs.apply == 'true'
      - name: Extract and apply patch
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-pass7-fixes.yml').read_text()
          start_marker = "printf '%s' '"
          end_marker = "' | base64 -d | gzip -d"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          import base64, gzip
          Path('/tmp/apply_pass7.py').write_bytes(gzip.decompress(base64.b64decode(source[start:end])))
          PY
          python /tmp/apply_pass7.py
      - name: Validate
        if: steps.guard.outputs.apply == 'true'
        run: |
          uv python install 3.11
          uv sync --locked
          uv run ruff format src/expertforge/checkpoints/store.py src/expertforge/checkpoints/tar_reader.py src/expertforge/checkpoints/restore.py tests/test_checkpoint_streaming_regressions.py
          uv run ruff check src/expertforge/checkpoints/store.py src/expertforge/checkpoints/tar_reader.py src/expertforge/checkpoints/restore.py tests/test_checkpoint_streaming_regressions.py
          uv run mypy src
          uv run pytest tests/test_checkpoint_streaming_regressions.py tests/test_checkpoint_store.py tests/test_checkpoint_restore.py
      - name: Commit fixes
        if: steps.guard.outputs.apply == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/expertforge/checkpoints/store.py src/expertforge/checkpoints/tar_reader.py src/expertforge/checkpoints/restore.py tests/test_checkpoint_streaming_regressions.py
          git commit -m 'fix: close streaming and cleanup boundaries (#11 review pass 7)'
          git push origin HEAD:local/11-checkpoint-system
