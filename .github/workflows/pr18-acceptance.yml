name: PR18 Acceptance Validation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr18-acceptance
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: local/7-provenance-environment
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync locked environment
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run mypy
        run: uv run --locked mypy src tests

      - name: Run full test suite
        run: uv run --locked pytest

      - name: Check package import
        run: uv run --locked python -c "import expertforge"

      - name: Check CLI fixture
        run: uv run --locked expertforge-config configs/smoke.yaml

      - name: Validate YAML files
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.').rglob('*.yaml')):
              if '.venv' in path.parts:
                  continue
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          PY

      - name: Check lockfile
        run: uv lock --check

      - name: Scan production files for committed secrets
        run: |
          uv run --locked python - <<'PY'
          import re
          from pathlib import Path

          patterns = {
              'github_token': re.compile(r'gh[pousr]_[A-Za-z0-9]{36,}'),
              'github_fine_grained_token': re.compile(r'github_pat_[A-Za-z0-9_]{40,}'),
              'aws_access_key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
          }
          roots = [Path('src'), Path('configs'), Path('doctrine'), Path('AGENTS.md'), Path('README.md')]
          hits: list[str] = []
          for root in roots:
              paths = [root] if root.is_file() else sorted(root.rglob('*'))
              for path in paths:
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for name, pattern in patterns.items():
                      if pattern.search(text):
                          hits.append(f'{path}:{name}')
          if hits:
              raise SystemExit('secret scan hits:\n' + '\n'.join(hits))
          print('secret scan: 0 hits')
          PY

      - name: Audit ExpertOS source boundary
        run: |
          uv run --locked python - <<'PY'
          import re
          from pathlib import Path

          patterns = [
              re.compile(r'(?m)^\s*(?:from|import)\s+expertos\b', re.IGNORECASE),
              re.compile(r'C:[\\/]+ExpertOS', re.IGNORECASE),
          ]
          hits: list[str] = []
          for root in (Path('src'), Path('tests'), Path('configs')):
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if any(pattern.search(text) for pattern in patterns):
                      hits.append(str(path))
          if hits:
              raise SystemExit('ExpertOS boundary hits:\n' + '\n'.join(hits))
          print('ExpertOS boundary audit: 0 hits')
          PY
