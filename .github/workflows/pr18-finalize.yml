name: PR18 Finalize

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

concurrency:
  group: pr18-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: local/7-provenance-environment
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Prepare final test and harness updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          harness_path = Path('.github/pr18/pr18_finalize.py')
          harness = harness_path.read_text(encoding='utf-8')
          harness = replace_once(
              harness,
              '    ) -> Literal["io_error", "timeout", "decode_error", "duplicate_device_ordinals", "not_found"]:',
              ') -> Literal["io_error", "timeout", "decode_error", "duplicate_device_ordinals", "not_found"]:',
              'hardware old signature marker',
          )
          harness = replace_once(
              harness,
              '    ) -> Literal["io_error", "timeout", "decode_error", "duplicate_device_ordinals"]:',
              ') -> Literal["io_error", "timeout", "decode_error", "duplicate_device_ordinals"]:',
              'hardware new signature marker',
          )
          harness_path.write_text(harness, encoding='utf-8')

          fixture_path = Path('.github/pr18/test_provenance_final_contracts.py')
          fixture = fixture_path.read_text(encoding='utf-8')
          fixture = replace_once(
              fixture,
              'from expertforge.config.resolve import resolve_config\n',
              'from expertforge.config.resolve import resolve_config\nfrom expertforge.identity.record import AttemptIdentityRecord\n',
              'fixture identity import',
          )
          fixture = replace_once(
              fixture,
              'from expertforge.provenance.record import AcceleratorInfo, LockfileDigest\n',
              'from expertforge.provenance.record import AcceleratorInfo, LockfileDigest, ProvenanceRecord\n',
              'fixture provenance import',
          )
          fixture = replace_once(
              fixture,
              'def _prepared_run(tmp_path: Path, *, dirty: bool = False):\n',
              'def _prepared_run(\n    tmp_path: Path, *, dirty: bool = False\n) -> tuple[AttemptIdentityRecord, ProvenanceRecord, Path]:\n',
              'fixture helper annotation',
          )
          fixture_path.write_text(fixture, encoding='utf-8')

          tests_path = Path('tests/test_record_provenance.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '''    def test_not_found_reason_accepted(self) -> None:
                  # ``not_found`` is a stable error reason; it is only valid on
                  # status='error' (unavailable forbids a reason).
                  lock = LockfileDigest(status="error", reason="not_found")
                  assert lock.reason == "not_found"
          ''',
              '''    def test_not_found_reason_rejected(self) -> None:
                  with pytest.raises(ValidationError):
                      LockfileDigest(status="error", reason="not_found")  # type: ignore[arg-type]
          ''',
              'lockfile not_found regression',
          )
          tests = replace_once(
              tests,
              '''    def test_known_reasons_accepted(self) -> None:
                  for r in ("io_error", "timeout", "decode_error", "not_found"):
                      accel = AcceleratorInfo(status="error", reason=r)
                      assert accel.reason == r
          ''',
              '''    def test_known_reasons_accepted(self) -> None:
                  assert AcceleratorInfo(status="error", reason="io_error").reason == "io_error"
                  assert AcceleratorInfo(status="error", reason="timeout").reason == "timeout"
                  assert AcceleratorInfo(status="error", reason="decode_error").reason == "decode_error"
          ''',
              'accelerator known reasons regression',
          )
          tests = replace_once(
              tests,
              '''    def test_lockfile_error_with_reason_accepted(self) -> None:
                  for r in ("io_error", "not_found"):
                      lock = LockfileDigest(status="error", reason=r)
                      assert lock.reason == r
          ''',
              '''    def test_lockfile_error_with_reason_accepted(self) -> None:
                  lock = LockfileDigest(status="error", reason="io_error")
                  assert lock.reason == "io_error"
          ''',
              'lockfile accepted error reasons',
          )
          tests = replace_once(
              tests,
              '            LockfileDigest(status="unavailable", reason="not_found")\n',
              '            LockfileDigest(\n                status="unavailable", reason="not_found"  # type: ignore[arg-type]\n            )\n',
              'lockfile unavailable not_found typing',
          )
          tests = replace_once(
              tests,
              '''    def test_accelerator_error_with_reason_accepted(self) -> None:
                  for r in ("io_error", "timeout", "decode_error", "duplicate_device_ordinals", "not_found"):
                      accel = AcceleratorInfo(status="error", reason=r)
                      assert accel.reason == r
          ''',
              '''    def test_accelerator_error_with_reason_accepted(self) -> None:
                  assert AcceleratorInfo(status="error", reason="io_error").reason == "io_error"
                  assert AcceleratorInfo(status="error", reason="timeout").reason == "timeout"
                  assert AcceleratorInfo(status="error", reason="decode_error").reason == "decode_error"
                  assert (
                      AcceleratorInfo(status="error", reason="duplicate_device_ordinals").reason
                      == "duplicate_device_ordinals"
                  )
          ''',
              'accelerator accepted error reasons',
          )
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Apply final contract corrections
        run: python .github/pr18/pr18_finalize.py

      - name: Sync locked environment
        run: uv sync --locked

      - name: Format generated edits
        run: uv run --locked ruff format .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run mypy
        run: uv run --locked mypy src tests

      - name: Run full test suite
        run: uv run --locked pytest

      - name: Check package import
        run: uv run --locked python -c "import expertforge"

      - name: Check CLI fixture
        run: uv run --locked expertforge-config configs/smoke.yaml

      - name: Check lockfile
        run: uv lock --check

      - name: Commit validated branch result
        env:
          BRANCH: local/7-provenance-environment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close final provenance contract gaps (#7)"
          git push origin "HEAD:${BRANCH}"
