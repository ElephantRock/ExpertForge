name: Telemetry review fix

on:
  push:
    branches:
      - local/9-logging-metrics
    paths:
      - .github/workflows/telemetry-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: local/9-logging-metrics
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Sync locked environment
        run: uv sync --locked

      - name: Apply reviewed corrections
        run: uv run --locked python scripts/apply_telemetry_review_fixes.py

      - name: Canonical formatting
        run: uv run --locked ruff format .

      - name: Static smoke check
        run: |
          uv run --locked ruff check .
          uv run --locked python -m compileall -q src tests
          git diff --check

      - name: Remove branch-only helpers
        run: rm scripts/apply_telemetry_review_fixes.py .github/workflows/telemetry-review-fix.yml

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close telemetry review contract gaps"
          git push origin HEAD:local/9-logging-metrics
