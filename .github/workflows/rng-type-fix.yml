name: RNG Type Fix

on:
  push:
    branches:
      - local/8-seed-rng

permissions:
  contents: write

concurrency:
  group: rng-type-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: local/8-seed-rng
          persist-credentials: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Apply precise static narrowing edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/expertforge/rng/adapters.py')
          text = path.read_text()
          text = text.replace(
              'from collections.abc import Sequence\n',
              'from collections.abc import Callable, Sequence\n',
          )
          text = text.replace(
              'from typing import Any, Literal, Protocol, runtime_checkable\n',
              'from typing import Any, Literal, Protocol, cast, runtime_checkable\n',
          )
          text = text.replace(
              '            if mode == "reproducible":\n'
              '                deterministic_api(True, warn_only=unsupported_policy == "warn")\n',
              '            if mode == "reproducible":\n'
              '                deterministic_call = cast(Callable[..., Any], deterministic_api)\n'
              '                deterministic_call(True, warn_only=unsupported_policy == "warn")\n',
          )
          text = text.replace(
              '            if not callable(cuda_manual_seed) or not callable(cuda_device):\n'
              '                raise FrameworkAdapterError("framework_api_unavailable")\n\n'
              '        derived_seeds = self.derive_seeds(root_seed, context)\n',
              '            if not callable(cuda_manual_seed) or not callable(cuda_device):\n'
              '                raise FrameworkAdapterError("framework_api_unavailable")\n'
              '        cuda_manual_seed_call = cast(Callable[[int], Any], cuda_manual_seed)\n'
              '        cuda_device_call = cast(Callable[[int], Any], cuda_device)\n\n'
              '        derived_seeds = self.derive_seeds(root_seed, context)\n',
          )
          text = text.replace(
              '                with cuda_device(ordinal):\n'
              '                    cuda_manual_seed(seed.seed_u64)\n',
              '                with cuda_device_call(ordinal):\n'
              '                    cuda_manual_seed_call(seed.seed_u64)\n',
          )
          text = text.replace(
              '        set_all: Any | None = None\n',
              '        set_all_call: Callable[[list[Any]], Any] | None = None\n',
          )
          text = text.replace(
              '            set_all = getattr(cuda, "set_rng_state_all", None)\n'
              '            if not callable(set_all):\n'
              '                raise FrameworkAdapterError("framework_api_unavailable")\n',
              '            set_all = getattr(cuda, "set_rng_state_all", None)\n'
              '            if not callable(set_all):\n'
              '                raise FrameworkAdapterError("framework_api_unavailable")\n'
              '            set_all_call = cast(Callable[[list[Any]], Any], set_all)\n',
          )
          text = text.replace(
              '            if cuda_devices:\n'
              '                set_all(cuda_tensors)\n',
              '            if set_all_call is not None:\n'
              '                set_all_call(cuda_tensors)\n',
          )
          path.write_text(text)

          path = Path('src/expertforge/rng/manager.py')
          text = path.read_text().replace(
              'np.random.set_state(self._numpy_legacy_to_runtime(bundle.numpy_legacy))',
              'np.random.set_state(cast(Any, self._numpy_legacy_to_runtime(bundle.numpy_legacy)))',
          )
          path.write_text(text)

          path = Path('tests/test_rng_manager.py')
          text = path.read_text().replace(
              'self.mode = cast(DeterminismMode | None, snapshot)',
              'self.mode = snapshot',
          )
          path.write_text(text)
          PY
          uv run --locked ruff format src/expertforge/rng tests/test_rng_manager.py
          uv run --locked ruff check --fix-only src/expertforge/rng tests/test_rng_manager.py

      - name: Remove workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rng-type-fix.yml
          git add src/expertforge/rng tests/test_rng_manager.py
          git commit -m "fix(rng): narrow guarded provider and NumPy APIs"
          git push origin HEAD:local/8-seed-rng
