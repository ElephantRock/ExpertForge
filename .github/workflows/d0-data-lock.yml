name: D0 data lock generation

on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/d0-data-lock.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d0-data-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Generate locked d0-data environment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.11

      - name: Resolve lockfile with pinned uv
        run: |
          uv lock
          uv lock --check

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d0-data-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
